<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Genie</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; border: 1px solid #333; padding: 2rem; border-radius: 20px; background: #1a1a1a; }
        input { background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        button { background: #6366f1; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Math Genie</h1>
        <p>A simple demo app inside the protected portal.</p>
        <input type="number" id="n1" placeholder="Number 1">
        <input type="number" id="n2" placeholder="Number 2">
        <br>
        <button onclick="calc()">Add Numbers</button>
        <h2 id="result"></h2>
    </div>
    <script>
        function calc() {
            const r = Number(document.getElementById('n1').value) + Number(document.getElementById('n2').value);
            document.getElementById('result').innerText = 'Result: ' + r;
        }
    </script>
</body>
</html>
